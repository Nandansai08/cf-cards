name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs these for actions/deploy-pages to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a queued one finish rather than
# cancelling it — a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # Pages serves a project site from https://<owner>.github.io/<repo>/, so
        # every asset and route needs that prefix. Derived from the repo name so
        # renaming the repository doesn't silently break every URL. If you move
        # the site to a custom domain, set this to "/" instead.
        run: npm run build:pages
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Absolute URL of the deployed site. Canonical links, Open Graph tags
          # and sitemap.xml all need one, and the static build has no request to
          # derive it from.
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          # Optional. Set the AVATAR_PROXY repository variable to the deployed
          # workers/avatar-proxy URL; unset, cards fall back to wsrv.nl.
          VITE_AVATAR_PROXY: ${{ vars.AVATAR_PROXY }}
          # Google Analytics. Only the deployed site is measured; local builds,
          # tests and forks load no analytics unless they set their own ID.
          VITE_GA_ID: G-2J47GTSD29

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
