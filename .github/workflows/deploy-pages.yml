name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/codeforces-cards-website-8phloq]
  workflow_dispatch:

# GITHUB_TOKEN needs these for actions/deploy-pages to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a queued one finish rather than
# cancelling it — a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        # Pages serves the site from https://<owner>.github.io/<repo>/, so every
        # asset and route needs that prefix. base_path comes from configure-pages.
        run: npm run build:pages
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
