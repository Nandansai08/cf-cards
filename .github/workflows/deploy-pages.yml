name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs these for actions/deploy-pages to publish.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, but let a queued one finish rather than
# cancelling it — a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A repository named <owner>.github.io is served from the domain root;
      # every other repository is served from /<repo>/. Renaming the repository
      # therefore changes every absolute URL on the site, so the paths are
      # derived here rather than written down.
      - name: Work out where the site will live
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo="${{ github.event.repository.name }}"
          if [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "$owner.github.io" ]; then
            base="/"
            site="https://$owner.github.io"
          else
            base="/$repo/"
            site="https://$owner.github.io/$repo"
          fi
          echo "Base path: $base"
          echo "Site URL:  $site"
          {
            echo "BASE_PATH=$base"
            echo "SITE_URL=$site"
            echo "VITE_SITE_URL=$site"
          } >> "$GITHUB_ENV"

      - name: Build
        # Pages serves a project site from https://<owner>.github.io/<repo>/, so
        # every asset and route needs that prefix. Derived from the repo name so
        # renaming the repository doesn't silently break every URL. If you move
        # the site to a custom domain, set this to "/" instead.
        run: npm run build:pages
        env:
          # BASE_PATH, SITE_URL and VITE_SITE_URL come from the step above.
          # Optional. Set the AVATAR_PROXY repository variable to the deployed
          # workers/avatar-proxy URL; unset, cards fall back to wsrv.nl.
          VITE_AVATAR_PROXY: ${{ vars.AVATAR_PROXY }}
          # Google Analytics. Only the deployed site is measured; local builds,
          # tests and forks load no analytics unless they set their own ID.
          VITE_GA_ID: G-2J47GTSD29
          # Google AdSense. Same gating as analytics — nothing loads anywhere
          # else. ads.txt is generated from this too.
          VITE_ADSENSE_CLIENT: ca-pub-6502365361842299
          ADSENSE_CLIENT: ca-pub-6502365361842299

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
